apply plugin: 'java-library'
apply plugin: 'maven-publish'

base.archivesName = "librarian-insight-${project.name}"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
    test {
        java.srcDir rootProject.file('common/src/test/java')
        resources.srcDir rootProject.file('common/src/test/resources')
    }
}
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }

def loaderName = project.name
def modVersion = project.version.toString()
def minecraftVersion = project.minecraft_version.toString()
def fabricLoaderVersion = project.loader_version.toString()
def fabricApiVersion = project.fabric_api_version.toString()
def distributionFile = tasks.named('remapJar').flatMap { it.archiveFile }
def commonRoot = rootProject.file('common/src')
def commonJavaRoot = rootProject.file('common/src/main/java')
def commonResourcesRoot = rootProject.file('common/src/main/resources')
def commonSources = fileTree(commonJavaRoot).matching { include '**/*.java' }
def commonResources = fileTree(commonResourcesRoot)
// Catch packaging regressions as part of every loader build, not just at release time.
tasks.register('verifyDistribution') {
    group = 'verification'
    dependsOn tasks.named('remapJar')
    inputs.file(distributionFile)
    inputs.dir(commonRoot)
    doLast {
        def archive = distributionFile.get().asFile
        assert archive.name == "librarian-insight-${loaderName}-${modVersion}.jar"
        def loaderPackages = ['fabric', 'neoforge', 'forge']
        def forbiddenLoaders = loaderPackages - loaderName
        def loaderApis = [fabric: 'net/fabricmc/', neoforge: 'net/neoforged/', forge: 'net/minecraftforge/']
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def entries = zip.entries().toList()
            def names = entries.collect { it.name }
            forbiddenLoaders.each { forbidden ->
                assert !names.any { it.startsWith("librarianinsight/${forbidden}/") }
            }
            assert !names.any { it.startsWith('net/fabricmc/') || it.startsWith('net/neoforged/') || it.startsWith('net/minecraftforge/') }
            assert !names.any { it.endsWith('.jar') } : 'No nested runtime dependencies are expected'
            assert names.contains('LICENSE_librarian-insight')
            assert names.contains('librarian_insight.mixins.json')
            commonResources.files.each { resource ->
                def path = commonResourcesRoot.toPath().relativize(resource.toPath()).toString().replace('\\', '/')
                assert zip.getInputStream(zip.getEntry(path)).bytes == resource.bytes : "Changed resource: ${path}"
            }
            commonSources.files.each { source ->
                def path = commonJavaRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/').replace('.java', '.class')
                assert names.contains(path) : "Missing shared class: ${path}"
                assert !(source.text =~ /net\.(fabricmc|neoforged|minecraftforge)\./).find() : "Loader import in common: ${source}"
            }
            entries.findAll { it.name.endsWith('.class') }.each { entry ->
                byte[] bytes = zip.getInputStream(entry).bytes
                assert ((bytes[6] & 255) << 8 | (bytes[7] & 255)) == 65 : "Not Java 21: ${entry.name}"
                def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                forbiddenLoaders.each { forbidden ->
                    assert !constants.contains(loaderApis[forbidden]) : "Foreign loader reference: ${entry.name}"
                }
            }
            if (loaderName == 'fabric') {
                assert !names.contains('META-INF/neoforge.mods.toml')
                assert !names.contains('META-INF/mods.toml')
                assert !names.contains('librarian_insight.neoforge.mixins.json')
                assert !names.contains('librarian_insight.forge.mixins.json')
                def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
                assert metadata.id == 'librarian_insight'
                assert metadata.name == 'Librarian Insight'
                assert metadata.version == modVersion
                assert metadata.environment == 'client'
                assert metadata.depends.minecraft == "~${minecraftVersion}"
                assert metadata.depends.fabricloader == ">=${fabricLoaderVersion}"
                assert metadata.depends['fabric-api'] == ">=${fabricApiVersion}"
                assert metadata.depends.java == '>=21'
            }
        }
        logger.lifecycle("Verified distribution: ${archive}")
    }
}
tasks.named('check') { dependsOn tasks.named('verifyDistribution') }
processResources {
    def properties = [version: project.version, minecraft_version: project.minecraft_version,
                      loader_version: project.loader_version, fabric_api_version: project.fabric_api_version]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}
jar {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_librarian-insight' } }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
