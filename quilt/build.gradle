plugins { id 'net.fabricmc.fabric-loom' }
apply from: rootProject.file('gradle/loader.gradle')

sourceSets.main.java.srcDir rootProject.file('fabric-quilt/src/main/java')

repositories {
    maven {
        name = 'Quilt'
        url = 'https://maven.quiltmc.org/repository/release/'
    }
}

configurations {
    quiltRuntimeMods
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "org.quiltmc:quilt-loader:${quilt_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    quiltRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    runtimeOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    runtimeOnly 'org.quiltmc:quilt-json5:1.0.4+final'
    runtimeOnly 'org.quiltmc:quilt-config:1.3.3'
}

def quiltDevelopmentJar = tasks.named('jar').flatMap { it.archiveFile }

loom {
    runs {
        client {
            runDir 'run'
            generateRunConfig = true
            displayName = 'Minecraft Client - Quilt 26.3'
            getAppendProjectPathToDisplayName().set(false)
            defaultMainClass = 'org.quiltmc.loader.impl.launch.knot.KnotClient'
        }
    }
    mods {
        librarian_insight {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('runClient') {
    dependsOn tasks.named('jar')
    doFirst {
        def fabricApiJar = configurations.quiltRuntimeMods.files.find {
            it.name == "fabric-api-${fabric_api_version}.jar"
        }
        assert fabricApiJar != null : 'Fabric API runtime JAR not found'
        jvmArgs "-Dloader.addMods=${quiltDevelopmentJar.get().asFile.absolutePath}" +
                "${File.pathSeparator}${fabricApiJar.absolutePath}"
    }
}
