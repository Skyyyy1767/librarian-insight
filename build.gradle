plugins {
    id 'base'
    id 'idea'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.2'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
}

idea.project.settings.runConfigurations {
    'Minecraft Client - Forge 26.3'(org.jetbrains.gradle.ext.Gradle) {
        setProject(rootProject.project(':forge'))
        taskNames = [':forge:runClient']
    }
}

tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build', ':forge:build' }
tasks.named('assemble') { dependsOn ':fabric:assemble', ':neoforge:assemble', ':forge:assemble' }
tasks.named('check') { dependsOn ':fabric:check', ':neoforge:check', ':forge:check' }
tasks.register('test') {
    group = 'verification'
    dependsOn ':fabric:test', ':neoforge:test', ':forge:test'
}
