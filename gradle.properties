# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.workers.max=2
# ForgeGradle 7 needs this to expose classes and resources as one development mod.
net.minecraftforge.gradle.merge-source-sets=true
# Let Gradle find all JDKs installed by CI while keeping Java 25 as JAVA_HOME.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_26_X64

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
next_minecraft_version=26.3
loader_version=0.19.3
loom_version=1.17.21
quilt_loader_version=0.31.0-beta.4
mixin_version=0.17.4+mixin.0.8.7

# Mod Properties
version=1.1+mc26.2
group=librarianinsight

# Dependencies
fabric_api_version=0.158.0+26.2

# NeoForge (Minecraft 26.2)
neoforge_version=26.2.0.87
moddev_version=2.0.147

# Forge (Minecraft 26.2)
forge_version=65.1.3
forge_loader_major=65
forgegradle_version=7.0.40

# Java 25 bytecode; override to use an installed newer development JDK.
java_version=25
