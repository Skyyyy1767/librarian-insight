# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.workers.max=2
# Let Gradle find Java 21 installations provided by development machines and CI.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
version=1.0.1.1+mc1.21.1
group=librarianinsight

# Dependencies
fabric_api_version=0.116.17+1.21.1

# Minecraft 1.21.1 requires Java 21.
java_version=21
