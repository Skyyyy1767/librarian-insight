# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.workers.max=2
# Let Gradle find all JDKs installed by CI while keeping Java 25 as JAVA_HOME.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_26_X64

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
version=1.0.1.1+mc26.3
group=librarianinsight

# Dependencies
fabric_api_version=0.160.7+26.3

# NeoForge (Minecraft 26.3)
neoforge_version=26.3.0.6-beta
moddev_version=2.0.147

# Java 25 bytecode; override to use an installed newer development JDK.
java_version=25
